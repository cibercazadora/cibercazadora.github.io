title: Priscilla Lopez — Director of Information Security
name: Priscilla
description: "I build security programs from zero that pass audits and earn trust. Nine domains, SOC 2 Type II, HIPAA, NIST 800-171, zero major findings. CISSP, GCPN, USAF veteran."
url: "https://priscillalopez.com"
baseurl: ""

# Build
markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:day/:title

# Collections
collections:
  projects:
    output: true
    permalink: /projects/:title

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"

# Exclude
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
